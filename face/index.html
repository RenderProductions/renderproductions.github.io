<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Render Face | Render Productions</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<style>
  .stage { perspective: 1100px; }
  .face {
    display: block;
    width: min(100%, 78vh);
    height: auto;
    margin: 0 auto;
    filter: drop-shadow(0 0 22px rgba(255, 230, 0, 0.22));
  }
  .roll { animation: roll 4.5s linear infinite; }
  @keyframes roll { from { transform: translateY(-50px); } to { transform: translateY(300px); } }
  .caption { text-align: center; margin: 1rem 0 0; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { .roll { animation: none; } }
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="/">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/rend-conomy/">Rend-Conomy</a></li>
      <li><a href="/bot/">Bot</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
      <li><a href="/games/">Games</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="sr-only">Render face</h1>
    <p class="sr-only">A large robot head with a screen face. Its eyes follow your pointer, it blinks now and then, and it frowns when your pointer leaves the window.</p>

    <div class="stage">
      <svg class="face" id="face" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="1.5" fill="#000" opacity="0.5"/>
          </pattern>
          <linearGradient id="rollg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe600" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#ffe600" stop-opacity="0.09"/>
            <stop offset="1" stop-color="#ffe600" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="screen-clip"><rect x="66" y="72" width="266" height="256" rx="22"/></clipPath>
        </defs>

        <!-- antenna with a status light -->
        <line x1="200" y1="34" x2="200" y2="15" stroke="#5a6278" stroke-width="4" stroke-linecap="round"/>
        <circle id="led" cx="200" cy="12" r="7" fill="#ffe600" filter="url(#glow)"/>

        <!-- the box: a darker block behind with a blue edge, then the front panel -->
        <rect x="50" y="50" width="330" height="330" rx="40" fill="#0a0f1c" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="3"/>
        <rect x="34" y="34" width="330" height="330" rx="40" fill="#05070d" stroke="#ffe600" stroke-width="5"/>

        <!-- screws -->
        <g fill="#0d1322" stroke="#5a6278" stroke-width="2">
          <circle cx="52" cy="52" r="6"/><circle cx="346" cy="52" r="6"/>
          <circle cx="52" cy="346" r="6"/><circle cx="346" cy="346" r="6"/>
        </g>
        <g stroke="#5a6278" stroke-width="2" stroke-linecap="round">
          <line x1="49" y1="52" x2="55" y2="52"/><line x1="343" y1="52" x2="349" y2="52"/>
          <line x1="49" y1="346" x2="55" y2="346"/><line x1="343" y1="346" x2="349" y2="346"/>
        </g>

        <!-- chin vents -->
        <g stroke="#1b2438" stroke-width="3" stroke-linecap="round">
          <line x1="150" y1="340" x2="250" y2="340"/>
          <line x1="150" y1="350" x2="250" y2="350"/>
        </g>

        <!-- screen -->
        <rect x="66" y="72" width="266" height="256" rx="22" fill="#080c16" stroke="#ffe600" stroke-opacity="0.25" stroke-width="2"/>
        <g clip-path="url(#screen-clip)">
          <g id="face-g">
            <g id="eye-l" transform="translate(143 170)"><rect x="-17" y="-46" width="34" height="92" rx="9" fill="#ffe600" filter="url(#glow)"/></g>
            <g id="eye-r" transform="translate(255 170)"><rect x="-17" y="-46" width="34" height="92" rx="9" fill="#ffe600" filter="url(#glow)"/></g>
            <g id="mouth" fill="#ffe600" filter="url(#glow)"></g>
          </g>
          <rect x="66" y="72" width="266" height="256" fill="url(#scan)"/>
          <rect class="roll" x="66" y="60" width="266" height="40" fill="url(#rollg)"/>
        </g>
      </svg>
    </div>

    <p class="meta caption" id="caption">RENDER VISION // WATCHING</p>
  </main>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>

<script>
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var SVG_NS = 'http://www.w3.org/2000/svg';
    function $(id) { return document.getElementById(id); }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function snap(v, step) { return Math.round(v / step) * step; }

    var face = $('face'), faceG = $('face-g'), led = $('led'), caption = $('caption');
    var eyes = [
      { g: $('eye-l'), x: 143, y: 170, dir: 1 },
      { g: $('eye-r'), x: 255, y: 170, dir: -1 }
    ];

    // The mouth is a row of LED segments that bend into a smile or a frown.
    var SEGMENTS = 9, mouthG = $('mouth'), segs = [];
    for (var i = 0; i < SEGMENTS; i++) {
      var r = document.createElementNS(SVG_NS, 'rect');
      r.setAttribute('x', 112 + i * 20);
      r.setAttribute('width', 14);
      r.setAttribute('height', 10);
      r.setAttribute('rx', 2);
      r.setAttribute('y', 262);
      mouthG.appendChild(r);
      segs.push(r);
    }

    var t0 = performance.now();
    var pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var look = { x: pointer.x, y: pointer.y };   // where the head is looking (eased)
    var wander = { x: pointer.x, y: pointer.y, next: 0 };
    var tilt = { x: 0, y: 0 };
    var lastMove = 0;
    var outside = false;      // pointer has left the window
    var away = false;         // tab was hidden
    var pulseUntil = 0;       // brief smile after you come back
    var mood = 0;             // -1 frown ... 0 neutral ... +1 smile
    var blink = { start: -1, next: t0 + 3200 };
    var glitch = { until: 0, next: t0 + 7000 };

    // ----- events -----
    window.addEventListener('pointermove', function (e) {
      pointer.x = e.clientX; pointer.y = e.clientY;
      lastMove = performance.now();
      if (outside) { outside = false; pulseUntil = performance.now() + 1500; }
    });
    // relatedTarget is null when the pointer leaves the browser window
    document.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) { outside = true; pointer.x = e.clientX; pointer.y = e.clientY; }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { away = true; }
      else if (away) { away = false; pulseUntil = performance.now() + 1500; }
    });
    face.addEventListener('click', function () {
      if (!reduce) blink.start = performance.now();
    });

    // ----- animation -----
    function ease(cur, target, amount) { return reduce ? target : cur + (target - cur) * amount; }

    function frame(now) {
      // Boot-up: the eyes open from a thin line.
      var bootT = reduce ? 1 : Math.min(1, (now - t0) / 700);
      var boot = 1 - Math.pow(1 - bootT, 3);

      // Where to look: the pointer, or wander on its own if it hasn't moved for a while.
      var target = pointer;
      if (!reduce && !outside && now - lastMove > 4000) {
        if (now > wander.next) {
          wander.x = window.innerWidth * (0.15 + Math.random() * 0.7);
          wander.y = window.innerHeight * (0.15 + Math.random() * 0.7);
          wander.next = now + 2200 + Math.random() * 2000;
        }
        target = wander;
      }
      look.x = ease(look.x, target.x, 0.3);
      look.y = ease(look.y, target.y, 0.3);

      // Head turns a little toward whatever it is looking at.
      var halfW = window.innerWidth / 2, halfH = window.innerHeight / 2;
      var nx = clamp((look.x - halfW) / halfW, -1, 1);
      var ny = clamp((look.y - halfH) / halfH, -1, 1);
      tilt.x = ease(tilt.x, nx, 0.08);
      tilt.y = ease(tilt.y, ny, 0.08);
      face.style.transform = reduce ? '' : 'rotateY(' + (tilt.x * 12).toFixed(2) + 'deg) rotateX(' + (-tilt.y * 9).toFixed(2) + 'deg)';

      // Mood: frown while the pointer is outside the window, smile briefly when it returns.
      var moodTarget = outside ? -1 : (now < pulseUntil ? 0.9 : 0);
      mood = ease(mood, moodTarget, 0.14);
      var sad = Math.max(0, -mood), happy = Math.max(0, mood);

      // Blink. Sad eyes are shorter, happy eyes slightly squinted.
      var base = (1 - sad * 0.25 - happy * 0.12) * Math.max(boot, 0.04);
      var scaleY = base;
      if (!reduce) {
        if (blink.start < 0 && now > blink.next) blink.start = now;
        if (blink.start >= 0) {
          var t = (now - blink.start) / 150;
          if (t >= 1) {
            blink.start = -1;
            blink.next = now + (Math.random() < 0.2 ? 220 : 2400 + Math.random() * 4200);
          } else {
            scaleY = base * (1 - Math.sin(Math.PI * t) * 0.93);
          }
        }
      }

      // Eyes slide inside the screen in small, snappy steps; sad eyes tilt like / \.
      var ox = snap(nx * 16, 3), oy = snap(ny * 14, 3);
      eyes.forEach(function (eye) {
        var rot = eye.dir * sad * 14;
        eye.g.setAttribute('transform',
          'translate(' + (eye.x + ox) + ' ' + (eye.y + oy) + ') rotate(' + rot.toFixed(1) + ') scale(1 ' + scaleY.toFixed(3) + ')');
      });

      // Mouth: LED segments in a curve, moved in pixel-sized steps.
      for (var i = 0; i < SEGMENTS; i++) {
        var k = (i - 4) / 4;
        var y = 262 + mood * 22 * (1 - k * k);
        segs[i].setAttribute('y', snap(y, 6));
        segs[i].setAttribute('opacity', boot.toFixed(2));
      }

      // Now and then the picture glitches sideways for a moment.
      var gx = 0, glitching = false;
      if (!reduce) {
        if (now > glitch.next && now > glitch.until) {
          glitch.until = now + 180;
          glitch.next = now + 9000 + Math.random() * 7000;
        }
        glitching = now < glitch.until;
        if (glitching) gx = (Math.random() - 0.5) * 14;
      }
      faceG.setAttribute('transform', 'translate(' + gx.toFixed(1) + ' 0)');
      faceG.setAttribute('opacity', glitching ? '0.75' : '1');

      // Status light on the antenna: pulses yellow, turns red when you are leaving.
      led.setAttribute('fill', outside ? '#ff4d4d' : '#ffe600');
      led.setAttribute('opacity', reduce ? '1' : (0.6 + 0.4 * Math.sin(now / 400)).toFixed(2));

      var text = (!reduce && now - t0 < 800) ? 'BOOTING...'
               : outside ? 'WARNING: USER LEAVING. PLEASE RECONSIDER.'
               : now < pulseUntil ? 'USER REACQUIRED. HAPPINESS RESTORED.'
               : 'RENDER VISION // WATCHING';
      if (caption.textContent !== text) caption.textContent = text;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
