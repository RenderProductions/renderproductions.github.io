# Fly.io settings for the Rend-Conomy bot.
# App names are global on Fly: if "rend-conomy" is taken, change it here and in the setup steps.
app = "rend-conomy"
primary_region = "ord"   # Chicago, closest to Detroit
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PREFIX = "r!"
  PORT = "8080"
  DB_PATH = "/data/rend-conomy.db"
  PRICES_URL = "https://renderproductions.github.io/prices.json"
  # DISCORD_TOKEN and DISCORD_CLIENT_ID are NOT here: set them with `fly secrets set`.

# The database lives on this volume so balances survive deploys.
[mounts]
  source = "rend_data"
  destination = "/data"

# Public web API for the site (/health, /api/leaderboard).
# The bot must stay connected to Discord, so the machine never auto-stops.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
