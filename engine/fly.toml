# fly.toml app configuration file generated for rend-conomy on 2026-11-09T04:48:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rend-conomy'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/rend-conomy.db'
  NODE_ENV = 'production'
  PORT = '8080'
  PREFIX = 'r!'
  PRICES_URL = 'https://renderproductions.github.io/prices.json'

[[mounts]]
  source = 'rend_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
