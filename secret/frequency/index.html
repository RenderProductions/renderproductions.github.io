<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freq Scanner | Render Productions</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="../">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="../">Home</a></li>
      <li><a href="../rend-conomy/">Rend-Conomy</a></li>
      <li><a href="../bot/">Bot</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="page-title">FREQ SCANNER</h1>
    <p class="tagline">Channel 01: Render Vision telemetry, active scan.</p>

    <div class="screen is-idle" id="screen">
      <div class="status" id="status-line">CH 01 // STANDBY</div>
      <div class="msg" id="msg">NO SIGNAL</div>
      <div class="stamp" id="stamp"></div>
    </div>

    <form class="tuner" id="tuner" autocomplete="off">
      <label for="codeinput">Frequency</label>
      <input class="input" id="codeinput" type="text" maxlength="40" placeholder="Enter code" spellcheck="false">
      <button class="btn primary" type="submit">Execute</button>
    </form>
    <!-- Optional: hide a hint for the frequency scanner here. -->
  </header>

  <p class="sr-only" id="announce" aria-live="polite"></p>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var screenEl = document.getElementById('screen');
  var statusEl = document.getElementById('status-line');
  var msgEl = document.getElementById('msg');
  var stampEl = document.getElementById('stamp');
  var announceEl = document.getElementById('announce');
  var formEl = document.getElementById('tuner');
  var inputEl = document.getElementById('codeinput');

  var reduce = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var GLYPHS = '░▒▓#%&@01';
  var token = 0;
  var timer = null;
  var typing = null;
  var reqId = 0;
  var dataPromise = null;
  var SIGNALS_URL = 'signals.json';

  function setState(cls) { screenEl.className = 'screen ' + cls; }

  function cancel() {
    token++;
    clearTimeout(timer);
    timer = null;
    typing = null;
  }

  function noise(n) {
    var s = '';
    for (var i = 0; i < n; i++) {
      s += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
    }
    return s;
  }

  function fromB64(value, label) {
    if (typeof value !== 'string' || !value.length) {
      throw new Error('Invalid or missing Base64 value: ' + label);
    }
    var normalized = value.replace(/\s/g, '');
    var bin;
    try {
      bin = atob(normalized);
    } catch (err) {
      throw new Error('Malformed Base64 value: ' + label);
    }
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function loadData() {
    if (!dataPromise) {
      dataPromise = fetch(SIGNALS_URL, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' while loading ' + SIGNALS_URL);
        return r.json();
      }).then(function (data) {
        if (!data || data.v !== 1 || data.kdf !== 'PBKDF2-SHA256' ||
            !Number.isInteger(data.iterations) || data.iterations < 1 ||
            !Array.isArray(data.entries) || !data.entries.length) {
          throw new Error('signals.json has an unsupported or invalid format.');
        }
        fromB64(data.salt, 'salt');
        if (fromB64(data.salt, 'salt').length < 8) {
          throw new Error('The salt in signals.json is too short.');
        }
        data.entries.forEach(function (entry, i) {
          if (!entry || typeof entry.iv !== 'string' || typeof entry.data !== 'string') {
            throw new Error('Entry ' + (i + 1) + ' is missing iv or data.');
          }
          if (fromB64(entry.iv, 'entries[' + i + '].iv').length !== 12) {
            throw new Error('Entry ' + (i + 1) + ' has an invalid AES-GCM IV; expected 12 bytes.');
          }
          if (fromB64(entry.data, 'entries[' + i + '].data').length < 16) {
            throw new Error('Entry ' + (i + 1) + ' has too little ciphertext data.');
          }
        });
        return data;
      }).catch(function (err) {
        dataPromise = null;
        console.error('[Freq Scanner] Could not load/validate signals.json:', err);
        throw err;
      });
    }
    return dataPromise;
  }

  function deriveKey(code, salt, iterations) {
    return crypto.subtle.importKey(
      'raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']
    ).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
    });
  }

  // Returns {signal: ...} for a match, null for an incorrect code,
  // or {offline: true, reason: ...} for an actual loading/crypto problem.
  function decode(code) {
    if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
      return Promise.resolve({
        offline: true,
        reason: 'Secure Web Crypto is unavailable. Use HTTPS or localhost.'
      });
    }

    return loadData().then(function (data) {
      var salt = fromB64(data.salt, 'salt');
      return deriveKey(code, salt, data.iterations).then(function (key) {
        var i = 0;
        function next() {
          if (i >= data.entries.length) return Promise.resolve(null);
          var entry = data.entries[i++];
          var iv = fromB64(entry.iv, 'entry iv');
          var ciphertext = fromB64(entry.data, 'entry data');

          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext)
            .then(function (buffer) {
              var payload = JSON.parse(new TextDecoder().decode(buffer));
              if (!payload || typeof payload.fragment !== 'string') {
                throw new Error('Decrypted signal payload is missing its fragment.');
              }
              return payload;
            }).catch(function (err) {
              // Wrong codes fail AES-GCM authentication. Also skip malformed entries
              // rather than stopping the scan on the first failed entry.
              console.debug('[Freq Scanner] Entry did not match or was invalid:', err);
              return next();
            });
        }
        return next();
      });
    }).catch(function (err) {
      console.error('[Freq Scanner] Decode failed:', err);
      return { offline: true, reason: err && err.message ? err.message : 'Unknown error' };
    });
  }

  function tune(code) {
    return new Promise(function (resolve) {
      var my = ++token, n = 0;
      setState('tuning');
      statusEl.textContent = 'CH 01 // TUNING ' + code;
      stampEl.textContent = '';
      (function step() {
        if (my !== token) return;
        if (n++ >= 10) { resolve(); return; }
        msgEl.textContent = noise(26) + '\n' + noise(32) + '\n' + noise(20);
        timer = setTimeout(step, 70);
      })();
    });
  }

  function typeOut(text, done) {
    if (reduce) { msgEl.textContent = text; done(); return; }
    var my = ++token, i = 0;
    var delay = Math.max(6, Math.min(28, 2600 / Math.max(1, text.length)));
    typing = { text: text, done: done };
    (function tick() {
      if (my !== token) return;
      i++;
      msgEl.textContent = text.slice(0, i);
      if (i < text.length) {
        timer = setTimeout(tick, delay);
      } else {
        typing = null;
        done();
      }
    })();
  }

  screenEl.addEventListener('click', function () {
    if (!typing) return;
    var current = typing;
    cancel();
    msgEl.textContent = current.text;
    current.done();
  });

  function show(code, sig) {
    if (sig && sig.offline) {
      setState('is-idle is-error');
      statusEl.textContent = 'CH 01 // SIGNAL SOURCE OFFLINE';
      msgEl.textContent = 'NO SIGNAL';
      stampEl.textContent = 'Source error. Check signals.json and the browser console.';
      announceEl.textContent = 'Signal source offline.';
      console.error('[Freq Scanner] Source error:', sig.reason);
      return;
    }

    if (!sig) {
      setState('is-idle is-error');
      statusEl.textContent = 'CH 01 // FREQUENCY NOT LOCATED';
      msgEl.textContent = 'NO SIGNAL';
      stampEl.textContent = '';
      announceEl.textContent = 'Frequency not located.';
      return;
    }

    setState(sig.type === 'decoy' ? 'is-decoy' : sig.type === 'rare' ? 'is-rare' : '');
    statusEl.textContent = 'CH 01 // FREQUENCY ' + code + ' // SIGNAL RECEIVED';
    stampEl.textContent = reduce ? (sig.timestamp || '') : 'Click the screen to skip';

    var text = sig.fragment.replace(/\s*<br\s*\/?>\s*/gi, '\n\n');
    typeOut(text, function () {
      stampEl.textContent = sig.timestamp || '';
      announceEl.textContent = text;
    });
  }

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();

    // Keep this normalization identical to the encryptor.
    var code = inputEl.value.trim().toUpperCase();
    if (!code) return;

    inputEl.value = '';
    inputEl.focus();
    cancel();
    announceEl.textContent = '';

    var id = ++reqId;
    var work = decode(code);
    var shown = reduce ? Promise.resolve() : tune(code);

    Promise.all([work, shown]).then(function (results) {
      if (id !== reqId) return;
      show(code, results[0]);
    }).catch(function (err) {
      // Defensive final catch: unexpected UI errors should not leave the scanner stuck.
      console.error('[Freq Scanner] Unexpected scanner error:', err);
      if (id === reqId) {
        show(code, { offline: true, reason: err && err.message });
      }
    });
  });
})();
</script>
</body>
</html>
