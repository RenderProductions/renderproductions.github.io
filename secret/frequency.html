<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freq Scanner | Render Productions</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="../">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="../">Home</a></li>
      <li><a href="../rend-conomy/">Rend-Conomy</a></li>
      <li><a href="../bot/">Bot</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="page-title">FREQ SCANNER</h1>
    <p class="tagline">Channel 01: Render Vision telemetry, active scan.</p>

    <div class="screen is-idle" id="screen">
      <div class="status" id="status-line">CH 01 // STANDBY</div>
      <div class="msg" id="msg">NO SIGNAL</div>
      <div class="stamp" id="stamp"></div>
    </div>

    <form class="tuner" id="tuner" autocomplete="off">
      <label for="codeinput">Frequency</label>
      <input class="input" id="codeinput" type="text" maxlength="40" placeholder="Enter code" spellcheck="false">
      <button class="btn primary" type="submit">Execute</button>
    </form>
    <!-- Optional: hide a hint for the frequency scanner here. -->
  </header>

  <p class="sr-only" id="announce" aria-live="polite"></p>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>

<script>
  (function () {
    // The messages live in signals.json, encrypted. Each code is the key to its own message,
    // so nothing readable is in this page or in that file until the right code is entered.

    var screenEl   = document.getElementById('screen');
    var statusEl   = document.getElementById('status-line');
    var msgEl      = document.getElementById('msg');
    var stampEl    = document.getElementById('stamp');
    var announceEl = document.getElementById('announce');
    var formEl     = document.getElementById('tuner');
    var inputEl    = document.getElementById('codeinput');

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var GLYPHS = '░▒▓#%&@01';
    var token = 0;      // bumps whenever a new action starts, so old timers stop themselves
    var timer = null;
    var typing = null;  // the message currently being typed, so a click can finish it
    var reqId = 0;
    var dataPromise = null;

    function setState(cls) { screenEl.className = 'screen ' + cls; }

    function cancel() { token++; clearTimeout(timer); typing = null; }

    function noise(n) {
      var s = '';
      for (var i = 0; i < n; i++) s += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
      return s;
    }

    function fromB64(s) {
      var bin = atob(s), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    // ----- loading and decrypting -----

    function loadData() {
      if (!dataPromise) {
        dataPromise = fetch('signals.json', { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .catch(function () { dataPromise = null; return null; });
      }
      return dataPromise;
    }
    loadData(); // start loading right away

    // Resolves to the signal if the code opens one, null if it opens none, or {offline: true} on failure.
    function decode(code) {
      if (!window.crypto || !crypto.subtle) return Promise.resolve({ offline: true });
      return loadData().then(function (data) {
        if (!data || !data.entries) return { offline: true };
        return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey'])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: fromB64(data.salt), iterations: data.iterations, hash: 'SHA-256' },
              base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
          })
          .then(function (key) {
            var i = 0;
            function next() {
              if (i >= data.entries.length) return null;
              var e = data.entries[i++];
              return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(e.iv) }, key, fromB64(e.data))
                .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); }, next);
            }
            return next();
          });
      }).catch(function () { return { offline: true }; });
    }

    // ----- screen effects -----

    function tune(code) {
      return new Promise(function (resolve) {
        var my = ++token, n = 0;
        setState('tuning');
        statusEl.textContent = 'CH 01 // TUNING ' + code;
        stampEl.textContent = '';
        (function step() {
          if (my !== token) return;
          if (n++ >= 10) { resolve(); return; }
          msgEl.textContent = noise(26) + '\n' + noise(32) + '\n' + noise(20);
          timer = setTimeout(step, 70);
        })();
      });
    }

    function typeOut(text, done) {
      if (reduce) { msgEl.textContent = text; done(); return; }
      var my = ++token, i = 0;
      var delay = Math.max(6, Math.min(28, 2600 / text.length)); // long messages type faster
      typing = { text: text, done: done };
      (function tick() {
        if (my !== token) return;
        i++;
        msgEl.textContent = text.slice(0, i);
        if (i < text.length) { timer = setTimeout(tick, delay); }
        else { typing = null; done(); }
      })();
    }

    // Clicking the screen finishes a message that is still typing.
    screenEl.addEventListener('click', function () {
      if (!typing) return;
      var t = typing;
      cancel();
      msgEl.textContent = t.text;
      t.done();
    });

    function show(code, sig) {
      if (sig && sig.offline) {
        setState('is-idle is-error');
        statusEl.textContent = 'CH 01 // SIGNAL SOURCE OFFLINE';
        msgEl.textContent = 'NO SIGNAL';
        stampEl.textContent = 'Try again in a moment.';
        announceEl.textContent = 'Signal source offline.';
        return;
      }
      if (!sig) {
        setState('is-idle is-error');
        statusEl.textContent = 'CH 01 // FREQUENCY NOT LOCATED';
        msgEl.textContent = 'NO SIGNAL';
        stampEl.textContent = '';
        announceEl.textContent = 'Frequency not located.';
        return;
      }

      setState(sig.type === 'decoy' ? 'is-decoy' : sig.type === 'rare' ? 'is-rare' : '');
      statusEl.textContent = 'CH 01 // FREQUENCY ' + code + ' // SIGNAL RECEIVED';
      stampEl.textContent = reduce ? sig.timestamp : 'Click the screen to skip';

      var text = String(sig.fragment).replace(/\s*<br>\s*/g, '\n\n');
      typeOut(text, function () {
        stampEl.textContent = sig.timestamp;
        announceEl.textContent = text;
      });
    }

    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      var code = inputEl.value.trim().toUpperCase();
      if (!code) return;
      inputEl.value = '';
      inputEl.focus();
      cancel();

      var id = ++reqId;
      var work = decode(code);
      var shown = reduce ? Promise.resolve() : tune(code);
      Promise.all([work, shown]).then(function (r) {
        if (id !== reqId) return; // a newer code was entered meanwhile
        show(code, r[0]);
      });
    });
  })();
</script>
</body>
</html>
