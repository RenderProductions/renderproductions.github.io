<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freq Scanner | Render Productions</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="../">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="../">Home</a></li>
      <li><a href="../rend-conomy/">Rend-Conomy</a></li>
      <li><a href="../bot/">Bot</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="page-title">FREQ SCANNER</h1>
    <p class="tagline">Channel 01: Render Vision telemetry, active scan.</p>

    <div class="screen is-idle" id="screen">
      <div class="status" id="status-line">CH 01 // STANDBY</div>
      <div class="msg" id="msg">NO SIGNAL</div>
      <div class="stamp" id="stamp"></div>
    </div>

    <form class="tuner" id="tuner" autocomplete="off">
      <label for="codeinput">Frequency</label>
      <input class="input" id="codeinput" type="text" maxlength="40" placeholder="Enter code" spellcheck="false">
      <button class="btn primary" type="submit">Execute</button>
    </form>
    <!-- Optional: hide a hint for the frequency scanner here. -->
  </header>

  <p class="sr-only" id="announce" aria-live="polite"></p>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>

<script>
  (function () {
    var SIGNALS = {
      "7540": {
        type: "lore",
        fragment: "He used to be so thoughtful.",
        timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
      },
      "RENDER": {
        type: "progressive",
        fragment: "The thing we always need more of, but the thing we waste the most.",
        timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
      },
      "TIME": {
        type: "progressive",
        fragment: "It heals all wounds.",
        timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
      },
      "67": {
        type: "decoy",
        fragment: "The 67 meme is officially dead to me. It’s reached that stage where an internet joke stops being a funny surprise and just becomes annoying background noise. At first, I loved it because people were being so creative with the references, but now it’s just the same punchline everywhere. It feels like people aren't even trying to be clever anymore; they’re just repeating it because everyone else is. <br> It’s honestly frustrating how it pops up in every single comment section and Discord server I’m in. Instead of actually contributing to a conversation, it just derails everything with a reference I’ve already seen a thousand times. The shock value is gone, and without that, there’s no humor left—just predictable repetition. <br> What bothers me most is how forced it feels now. People shoehorn it into conversations where it makes zero sense, which turns it from a joke into straight-up spam. I love how fast internet culture moves and how we’re always finding new ways to laugh, but this meme just hasn't evolved. It’s stuck in the same format with no room for creativity. I think it’s time we all just move on to something actually fresh and original.",
        timestamp: "DIAGNOSTIC: EVALUATE PARAMETERS."
      },
      "WONDER": {
        type: "decoy",
        fragment: "You think you're tough shit putting Varandia characters in here, huh? you're not getting any lore with this!",
        timestamp: "OVERRIDE ACCEPTED."
      },
      "AM": {
        type: "rare",
        fragment: "Never for me to plunge my hands in cool water on a hot day.",
        timestamp: "SYSTEM ALERT: CRITICAL MASS."
      },
      "ARCHIE": {
        type: "rare",
        fragment: "I AM A FUCKING ARCHITECT! I'M JUST STUCK SELLING SHIT FURNITURE",
        timestamp: "SYSTEM ALERT: HOST TERMINATED."
      },
      "RETOLD": {
        type: "decoy"
        fragment: "What a waste of time, it was. Really."
    timestamp: "HATE."
    };

    var screenEl   = document.getElementById('screen');
    var statusEl   = document.getElementById('status-line');
    var msgEl      = document.getElementById('msg');
    var stampEl    = document.getElementById('stamp');
    var announceEl = document.getElementById('announce');
    var formEl     = document.getElementById('tuner');
    var inputEl    = document.getElementById('codeinput');

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var GLYPHS = '░▒▓#%&@01';
    var token = 0;      // bumps whenever a new action starts, so old timers stop themselves
    var timer = null;
    var typing = null;  // the message currently being typed, so a click can finish it

    function setState(cls) { screenEl.className = 'screen ' + cls; }

    function cancel() { token++; clearTimeout(timer); typing = null; }

    function noise(n) {
      var s = '';
      for (var i = 0; i < n; i++) s += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
      return s;
    }

    function tune(code, next) {
      var my = ++token, n = 0;
      setState('tuning');
      statusEl.textContent = 'CH 01 // TUNING ' + code;
      stampEl.textContent = '';
      (function step() {
        if (my !== token) return;
        if (n++ >= 10) { next(); return; }
        msgEl.textContent = noise(26) + '\n' + noise(32) + '\n' + noise(20);
        timer = setTimeout(step, 70);
      })();
    }

    function typeOut(text, done) {
      if (reduce) { msgEl.textContent = text; done(); return; }
      var my = ++token, i = 0;
      var delay = Math.max(6, Math.min(28, 2600 / text.length)); // long messages type faster
      typing = { text: text, done: done };
      (function tick() {
        if (my !== token) return;
        i++;
        msgEl.textContent = text.slice(0, i);
        if (i < text.length) { timer = setTimeout(tick, delay); }
        else { typing = null; done(); }
      })();
    }

    // Clicking the screen finishes a message that is still typing.
    screenEl.addEventListener('click', function () {
      if (!typing) return;
      var t = typing;
      cancel();
      msgEl.textContent = t.text;
      t.done();
    });

    function show(code) {
      if (!Object.prototype.hasOwnProperty.call(SIGNALS, code)) {
        setState('is-idle is-error');
        statusEl.textContent = 'CH 01 // FREQUENCY NOT LOCATED';
        msgEl.textContent = 'NO SIGNAL';
        stampEl.textContent = '';
        announceEl.textContent = 'Frequency not located.';
        return;
      }

      var sig = SIGNALS[code];
      setState(sig.type === 'decoy' ? 'is-decoy' : sig.type === 'rare' ? 'is-rare' : '');
      statusEl.textContent = 'CH 01 // FREQUENCY ' + code + ' // SIGNAL RECEIVED';
      stampEl.textContent = reduce ? sig.timestamp : 'Click the screen to skip';

      // The data uses <br> between paragraphs; show them as blank lines.
      var text = sig.fragment.replace(/\s*<br>\s*/g, '\n\n');
      typeOut(text, function () {
        stampEl.textContent = sig.timestamp;
        announceEl.textContent = text;
      });
    }

    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      var code = inputEl.value.trim().toUpperCase();
      if (!code) return;
      inputEl.value = '';
      inputEl.focus();
      cancel();
      if (reduce) { show(code); return; }
      tune(code, function () { show(code); });
    });
  })();
</script>
</body>
</html>
