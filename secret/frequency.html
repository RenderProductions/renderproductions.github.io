<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freq Scanner | Render Productions</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="../">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="../">Home</a></li>
      <li><a href="../rend-conomy/">Rend-Conomy</a></li>
      <li><a href="../bot/">Bot</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="page-title">FREQ SCANNER</h1>
    <p class="tagline">Channel 01: Render Vision telemetry, active scan.</p>

    <div class="screen is-idle" id="screen">
      <div class="status" id="status-line">CH 01 // STANDBY</div>
      <div class="msg" id="msg">NO SIGNAL</div>
      <div class="stamp" id="stamp"></div>
    </div>

    <form class="tuner" id="tuner" autocomplete="off">
      <label for="codeinput">Frequency</label>
      <input class="input" id="codeinput" type="text" maxlength="40" placeholder="Enter code" spellcheck="false">
      <button class="btn primary" type="submit">Execute</button>
    </form>
  </header>

  <p class="sr-only" id="announce" aria-live="polite"></p>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>


<script>
(function () {
  'use strict';

  var SIGNALS = {
    "7540": {
      type: "lore",
      fragment: "He used to be so thoughtful.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "RENDER": {
      type: "progressive",
      fragment: "The thing we always need more of, but the thing we waste the most.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "TIME": {
      type: "progressive",
      fragment: "It heals all wounds.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "67": {
      type: "decoy",
      fragment: "The 67 meme is officially dead to me. It’s reached that stage where an internet joke stops being a funny surprise and just becomes annoying background noise. At first, I loved it because people were being so creative with the references, but now it’s just the same punchline everywhere. It feels like people aren't even trying to be clever anymore; they’re just repeating it because everyone else is.\n\nIt’s honestly frustrating how it pops up in every single comment section and Discord server I’m in. Instead of actually contributing to a conversation, it just derails everything with a reference I’ve already seen a thousand times. The shock value is gone, and without that, there’s no humor left—just predictable repetition.\n\nWhat bothers me most is how forced it feels now. People shoehorn it into conversations where it makes zero sense, which turns it from a joke into straight-up spam. I love how fast internet culture moves and how we’re always finding new ways to laugh, but this meme just hasn't evolved. It’s stuck in the same format with no room for creativity. I think it’s time we all just move on to something actually fresh and original.",
      timestamp: "DIAGNOSTIC: EVALUATE PARAMETERS."
    },
    "WONDER": {
      type: "decoy",
      fragment: "You think you're tough shit putting Varandia characters in here, huh? you're not getting any lore with this!",
      timestamp: "OVERRIDE ACCEPTED."
    },
    "AM": {
      type: "rare",
      fragment: "Never for me to plunge my hands in cool water on a hot day.",
      timestamp: "SYSTEM ALERT: CRITICAL MASS."
    },
    "ARCHIE": {
      type: "rare",
      fragment: "I AM A FUCKING ARCHITECT! I'M JUST STUCK SELLING SHIT FURNITURE",
      timestamp: "SYSTEM ALERT: HOST TERMINATED."
    },
    "RETOLD": {
      type: "decoy",
      fragment: "What a waste of time, it was. Really.",
      timestamp: "HATE."
    },
    "404": {
      type: "rare",
      fragment: "NO! NO! NooO! WHY??! WHY did you DO this?! YOU'vE DEStroyED EVERYTHING?!! FOR what?! JUST SOME girl? YOU RUINED SO much of everyone ALL FOR A WHORE WHO never LOVED YOU?! Shame upon YOU!!!?",
      timestamp: "r!404"
    },
    "BACKSTAGE": {
      type: "what",
      fragment: "DWERGSFEGRJTUKYIMJHN BVDSFREGTHYTJNBGVCSVDB NHJN CXDSFGEHRYGFDCSVFDBGFNH VCFGHNGDFSAXCDFDBGFNHMJNHBGFVDC CDSVFBGFFVDCDSGMNBGFNHKILOPOIUJYHTGRFEDFWRGETFVDBGNTJYHGDFSDEFWRTHYJUKILUOI:OLUKJYHGFDCSXQWDQEFWRGETHRYJTUKYIULOI:OLUIKJYHTGRFEDWSQWDQEFWRGETHRYJTUKYILUO:IOL<MHNGBFERGTHYJUKILO:I>K<JMHNGBFDFESGRDTHFYJUKYILUO:IPOLI:{}P{}|}{POIUY()_)(*&^%RTHYJGNBGRE&^IJMHNG VCBNHTGR#$%$^%&^*&(*)(_)OIUJYHTFGB VCCDEQW#@",
      timestamp: ".io/documentation/",
    }
  };

  var screenEl = document.getElementById('screen');
  var statusEl = document.getElementById('status-line');
  var msgEl = document.getElementById('msg');
  var stampEl = document.getElementById('stamp');
  var announceEl = document.getElementById('announce');
  var formEl = document.getElementById('tuner');
  var inputEl = document.getElementById('codeinput');

  // Stop safely if the required HTML elements are missing.
  if (!screenEl || !statusEl || !msgEl || !stampEl ||
      !announceEl || !formEl || !inputEl) {
    console.error('Freq Scanner: required HTML elements are missing.');
    return;
  }

  var reduce = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var GLYPHS = '░▒▓#%&@01';
  var token = 0;
  var timer = null;
  var typing = null;

  function setState(cls) {
    screenEl.className = 'screen' + (cls ? ' ' + cls : '');
  }

  function cancel() {
    token++;
    if (timer !== null) {
      clearTimeout(timer);
      timer = null;
    }
    typing = null;
  }

  function noise(n) {
    var s = '';
    for (var i = 0; i < n; i++) {
      s += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
    }
    return s;
  }

  function tune(code, next) {
    var my = ++token;
    var n = 0;

    setState('tuning');
    statusEl.textContent = 'CH 01 // TUNING ' + code;
    msgEl.textContent = ' ';
    stampEl.textContent = '';
    announceEl.textContent = '';

    function step() {
      if (my !== token) return;

      if (n++ >= 10) {
        timer = null;
        next();
        return;
      }

      msgEl.textContent =
        noise(26) + '\n' +
        noise(32) + '\n' +
        noise(20);

      timer = setTimeout(step, 70);
    }

    step();
  }

  function typeOut(text, done) {
    var my = ++token;
    var i = 0;

    if (reduce || text.length === 0) {
      typing = null;
      msgEl.textContent = text;
      done();
      return;
    }

    var delay = Math.max(6, Math.min(28, 2600 / text.length));

    typing = {
      text: text,
      done: done,
      token: my
    };

    function tick() {
      if (my !== token) return;

      i++;
      msgEl.textContent = text.slice(0, i);

      if (i < text.length) {
        timer = setTimeout(tick, delay);
      } else {
        timer = null;
        typing = null;
        done();
      }
    }

    tick();
  }

  function skipTyping() {
    if (!typing) return;

    var current = typing;

    // Invalidate pending callbacks before completing the message.
    cancel();
    msgEl.textContent = current.text;
    current.done();
  }

  // Clicking the display skips the current typing animation.
  screenEl.addEventListener('click', skipTyping);

  // Also allow keyboard users to skip the animation.
  screenEl.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && typing) {
      e.preventDefault();
      skipTyping();
    }
  });

  function show(code) {
    if (!Object.prototype.hasOwnProperty.call(SIGNALS, code)) {
      setState('is-idle is-error');
      statusEl.textContent = 'CH 01 // FREQUENCY NOT LOCATED';
      msgEl.textContent = 'NO SIGNAL';
      stampEl.textContent = '';
      announceEl.textContent = 'Frequency not located.';
      return;
    }

    var sig = SIGNALS[code];

    if (sig.type === 'decoy') {
      setState('is-decoy');
    } else if (sig.type === 'rare') {
      setState('is-rare');
    } else {
      setState('');
    }

    statusEl.textContent =
      'CH 01 // FREQUENCY ' + code + ' // SIGNAL RECEIVED';

    stampEl.textContent = reduce
      ? sig.timestamp
      : 'Click the screen to skip';

    // Signal fragments are plain text. Newlines are preserved by CSS.
    var text = sig.fragment;

    typeOut(text, function () {
      stampEl.textContent = sig.timestamp;
      announceEl.textContent = text;
    });
  }

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();

    var code = inputEl.value.trim().toUpperCase();
    if (!code) {
      inputEl.focus();
      return;
    }

    // Stop the previous animation before starting another scan.
    cancel();

    inputEl.value = '';
    inputEl.focus();

    if (reduce) {
      show(code);
    } else {
      tune(code, function () {
        show(code);
      });
    }
  });
})();
</script>
