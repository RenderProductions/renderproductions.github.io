<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freq Scanner | Render Productions</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Main">
    <a class="brand" href="../">RENDER PRODUCTIONS</a>
    <ul>
      <li><a href="../">Home</a></li>
      <li><a href="../rend-conomy/">Rend-Conomy</a></li>
      <li><a href="https://discord.gg/D2v4EsuZBU">Discord</a></li>
      <li><a href="/bot/">Bot</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="page-title" id="signaltext">NO SIGNAL</h1>
    <p class="tagline">Channel 01: Render Vision telemetry, active scan.</p>

    <form class="tuner" id="tuner" autocomplete="off">
      <label for="codeinput">Frequency</label>
      <input class="input" id="codeinput" type="text" maxlength="40" placeholder="Enter code" spellcheck="false">
      <button class="btn primary" type="submit">Execute</button>
    </form>
    <p class="error" id="errormsg" role="alert"></p>
  </header>

  <section aria-labelledby="log-title">
    <div class="section-head">
      <h2 id="log-title">Recovered signals</h2>
      <span id="count">0 logged</span>
    </div>
    <div id="history" aria-live="polite">
      <p class="empty">Nothing received yet. Enter a code to start scanning.</p>
    </div>
  </section>

  <footer class="footer">
    <span>Backstage</span>
    <span>Host: The Render Room</span>
  </footer>

</div>

<script>
  var SIGNALS = {
    "7540": {
      type: "lore",
      fragment: "He used to be so thoughtful.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "RENDER": {
      type: "progressive",
      fragment: "The thing we always need more of, but the thing we waste the most.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "TIME": {
      type: "progressive",
      fragment: "It heals all wounds.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "67": {
      type: "decoy",
      fragment: "The 67 meme is officially dead to me. It’s reached that stage where an internet joke stops being a funny surprise and just becomes annoying background noise. At first, I loved it because people were being so creative with the references, but now it’s just the same punchline everywhere. It feels like people aren't even trying to be clever anymore; they’re just repeating it because everyone else is. <br> It’s honestly frustrating how it pops up in every single comment section and Discord server I’m in. Instead of actually contributing to a conversation, it just derails everything with a reference I’ve already seen a thousand times. The shock value is gone, and without that, there’s no humor left—just predictable repetition. <br> What bothers me most is how forced it feels now. People shoehorn it into conversations where it makes zero sense, which turns it from a joke into straight-up spam. I love how fast internet culture moves and how we’re always finding new ways to laugh, but this meme just hasn't evolved. It’s stuck in the same format with no room for creativity. I think it’s time we all just move on to something actually fresh and original.",
      timestamp: "DIAGNOSTIC: EVALUATE PARAMETERS."
    },
    "WONDER": {
      type: "decoy",
      fragment: "You think you're tough shit putting Varandia characters in here, huh? you're not getting any lore with this!",
      timestamp: "OVERRIDE ACCEPTED."
    },
    "AM": {
      type: "rare",
      fragment: "Never for me to plunge my hands in cool water on a hot day.",
      timestamp: "SYSTEM ALERT: CRITICAL MASS."
    },
    "ARCHIE": {
      type: "rare",
      fragment: "I AM A FUCKING ARCHITECT! I'M JUST STUCK SELLING SHIT FURNITURE",
      timestamp: "SYSTEM ALERT: HOST TERMINATED."
    },
    "VARANDIA": {
      type: "rare",
      fragment: "I miss. Hosea.",
      timestamp: "SYSTEM ALERT: HOST TERMINATED."
    }
  };

  var form    = document.getElementById('tuner');
  var input   = document.getElementById('codeinput');
  var errorEl = document.getElementById('errormsg');
  var title   = document.getElementById('signaltext');
  var history = document.getElementById('history');
  var countEl = document.getElementById('count');
  var logged  = 0;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = input.value.trim().toUpperCase();
    if (!code) return;

    // hasOwnProperty so inputs like "constructor" don't hit Object.prototype
    if (!Object.prototype.hasOwnProperty.call(SIGNALS, code)) {
      title.textContent = 'NO SIGNAL';
      errorEl.textContent = '[ERROR] Frequency not located';
      input.select();
      return;
    }

    var sig = SIGNALS[code];
    errorEl.textContent = '';
    title.textContent = 'SIGNAL LOCKED';

    var entry = document.createElement('div');
    entry.className = 'log is-new' +
      (sig.type === 'decoy' ? ' is-decoy' : '') +
      (sig.type === 'rare' ? ' is-rare' : '');

    var label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'Frequency ' + code;

    var fragment = document.createElement('div');
    fragment.className = 'fragment';
    fragment.innerHTML = sig.fragment; // trusted constant above; contains <br>

    var stamp = document.createElement('div');
    stamp.className = 'stamp';
    stamp.textContent = sig.timestamp;

    entry.appendChild(label);
    entry.appendChild(fragment);
    entry.appendChild(stamp);

    var empty = history.querySelector('.empty');
    if (empty) empty.remove();
    history.insertBefore(entry, history.firstChild);

    logged++;
    countEl.textContent = logged + ' logged';
    input.value = '';
    input.focus();
  });
</script>
</body>
</html>
