name: Update market prices

on:
  workflow_dispatch:          # run by hand from the Actions tab (forces one tick)

permissions:
  contents: write   # lets the job commit prices.json
  pages: write      # lets the job ask GitHub Pages to rebuild

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance prices
        run: node .github/scripts/tick.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      # Commits pushed with the built-in token do not trigger a Pages build,
      # so we ask for one ourselves, but only when prices.json really changed.
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rend-conomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Market tick"
          git pull --rebase
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds