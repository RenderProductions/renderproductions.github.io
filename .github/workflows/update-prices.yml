name: Update market prices

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write   # lets the job commit prices.json
  pages: write      # lets the job ask GitHub Pages to rebuild

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance prices
        run: node .github/scripts/tick.js

      - name: Commit prices.json
        run: |
          git config user.name "rend-conomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git commit -m "Market tick" || exit 0
          git pull --rebase
          git push

      # Commits pushed with the built-in token do not trigger a Pages build,
      # so without this step the live site would never pick up the new prices.
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds