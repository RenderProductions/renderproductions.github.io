name: Deploy the Worker

# Deploys activity/worker.js to Cloudflare whenever it (or its config) changes on main.
# Needs three repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview page
#   D1_DATABASE_ID         from Storage & Databases -> D1 -> the database
on:
  push:
    branches: [main]
    paths: ['activity/worker.js', 'activity/wrangler.toml', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency: worker-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.D1_DATABASE_ID != '' }}
    steps:
      - name: Skip until the secrets are set
        if: env.READY != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and D1_DATABASE_ID to the repo's secrets to deploy the Worker from here."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - name: Fill in the database ID
        if: env.READY == 'true'
        run: sed -i "s/D1_DATABASE_ID/${D1_ID}/" activity/wrangler.toml
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
      - uses: cloudflare/wrangler-action@v3
        if: env.READY == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: activity
