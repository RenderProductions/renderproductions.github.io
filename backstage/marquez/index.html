<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>...</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="marquez.css?v=12">
</head>
<body data-who="Cedar">
<!-- A dark room. Marquez sits behind his desk. Dialogue lives in dialogue.json; art goes in art/. -->
<main class="room" id="room">
  <div class="light" aria-hidden="true"></div>

  <div class="scene">
    <!-- art/marquez.svg is his normal look. Expressions: art/marquez-<face>.svg (or .png). -->
    <div class="him">
      <img id="him" src="art/marquez.svg" alt="Marquez, sitting behind a desk">
      <span class="pocket" aria-hidden="true"></span>
    </div>
    <svg class="desk" viewBox="0 0 541.08 149.71" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><defs><linearGradient x1="238.5" y1="268" x2="238.5" y2="299" gradientUnits="userSpaceOnUse" id="deskShade"><stop offset="0" stop-color="#0d0702"/><stop offset="1" stop-color="#0d0702" stop-opacity="0"/></linearGradient></defs><g transform="translate(30.51028,-223.15)" fill-rule="nonzero" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="10"><path d="M-15,264.6l92,-36.2h325l92,36.2l1,107l-509.7423,-2.72829z" fill="#3f2410" stroke="#24140a" stroke-linecap="butt"/><path d="M-17.5,299v-31h512v31z" fill="url(#deskShade)" stroke="none" stroke-linecap="butt"/><path d="M-29.24581,262.62235l97.13966,-38.22235h343.15642l97.13966,38.22235l1.05587,18.97765l-538.21952,-2.8807z" fill="#5e3b22" stroke="#3b2516" stroke-linecap="butt"/><path d="M490.5,263l-497,0" fill="none" stroke="#3b2516" stroke-linecap="round"/></g></svg>
    <div class="shroud" aria-hidden="true"></div>
  </div>

  <!-- Cedar's workbench (bench.js): opens when he says the "craft" node. Recipes are in /items.json. -->
  <section class="bench" id="bench" data-panel hidden aria-label="Workbench">
    <div class="bench-bulb" aria-hidden="true"><img src="/backstage/drawer/art/bright_bulb.svg" alt="" draggable="false"></div>
    <div class="bench-slots">
      <button class="slot" type="button" aria-label="Empty spot"></button>
      <span class="plus" aria-hidden="true">+</span>
      <button class="slot" type="button" aria-label="Empty spot"></button>
    </div>
    <div class="bench-tray" id="bench-tray"></div>
    <div class="bench-acts">
      <button id="bench-no" type="button" class="quiet">NOT NOW</button>
      <button id="bench-go" type="button" disabled>PUT THEM TOGETHER</button>
    </div>
  </section>

  <div class="prompt" id="prompt">press Z or tap to approach</div>

  <section class="box" id="box" hidden aria-live="polite">
    <div class="plate" id="plate">MARQUEZ</div>
    <div class="text" id="text"></div>
    <ul class="choices" id="choices" hidden></ul>
    <form class="answer" id="answer" hidden autocomplete="off">
      <label class="sr-only" for="answer-in">What did you find?</label>
      <span class="caret" aria-hidden="true">&rsaquo;</span>
      <input id="answer-in" type="text" maxlength="40" spellcheck="false" autocapitalize="characters" placeholder="what did you find?">
      <button type="submit">SHOW HIM</button>
    </form>
    <span class="more" id="more" aria-hidden="true">&#9662;</span>
  </section>

  <button class="mute" id="mute" type="button" aria-pressed="false" title="Sound (M)">SOUND: ON</button>
  <a class="leave" href="/backstage/">&larr; back</a>
</main>
<noscript><p class="nojs">(It's too dark to talk without JavaScript.)</p></noscript>
<script src="/inventory.js?v=3"></script>
<script src="marquez.js?v=18"></script>
<script src="bench.js?v=1"></script>
<script src="/backstage/brain/mind.js?v=1"></script>
<script type="module" src="cedar3d.js?v=3"></script>
</body>
</html>
