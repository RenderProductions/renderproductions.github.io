<meta property="og:type" content="website">

<meta property="og:description" content="THE STAR IS BORN TO SHINE!!">
<meta property="og:url" content="https://renderproductions.github.io/backstage/wonder/">
<meta property="og:image" content="https://renderproductions.github.io/og/wonder.png">

<body data-who="Wonder">
<!-- The void. Pitch black, nothing in it but Wonder, drifting.
     Only reachable with the rusted key (the locked CH 02 note on the backstage board).
     His words live in dialogue.json; the conversation engine is /backstage/marquez/marquez.js,
     set up for Wonder by window.TALK in wonder.js, which also handles the lock and makes him drift. -->
<main class="room" id="room">
  <div class="drifter" id="drifter">
    <img id="him" src="art/wonder.svg" alt="Wonder, drifting in the dark" draggable="false">
  </div>

  <div class="prompt" id="prompt">press Z or tap to call out</div>

  <section class="box" id="box" hidden aria-live="polite">
    <div class="plate" id="plate">WONDER</div>
    <div class="text" id="text"></div>
    <ul class="choices" id="choices" hidden></ul>
    <form class="answer" id="answer" hidden autocomplete="off">
      <label class="sr-only" for="answer-in">What do you say?</label>
      <span class="caret" aria-hidden="true">&rsaquo;</span>
      <input id="answer-in" type="text" maxlength="40" spellcheck="false" autocapitalize="characters" placeholder="say something">
      <button type="submit">SAY IT</button>
    </form>
    <span class="more" aria-hidden="true">&#9662;</span>
  </section>

  <button class="mute" id="mute" type="button" aria-pressed="false" title="Sound (M)">SOUND: ON</button>
  <a class="leave" href="/backstage/">&larr; back</a>
</main>
<noscript><p class="nojs">(Nothing. Not even an echo.)</p></noscript>
<script src="/inventory.js?v=3"></script>
<script src="wonder.js?v=13"></script>
<script src="/backstage/marquez/marquez.js?v=18"></script>
<script src="/backstage/brain/mind.js?v=2"></script>
</body>
</html>
