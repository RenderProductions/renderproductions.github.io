<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Drawer</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="drawer.css?v=7">
</head>
<body>
<!-- Looking down into the open desk drawer. The drawing is art/drawer.svg (drawer.js puts it in).
     Whatever the visitor has found lies on its floor. Items come from /items.json;
     what this visitor owns comes from /inventory.js (their browser only). -->
<main class="room">
  <a class="shut" href="/backstage/#desk">shut the drawer &rarr;</a>

  <div class="drawer" id="drawer">
    <div class="art" id="art" aria-hidden="true"></div>
    <div class="floor" id="floor" aria-label="Inside the drawer">
      <p class="empty" id="empty" hidden>nothing in here.</p>
    </div>
    <div class="slip" id="slip" aria-live="polite" hidden>
      <div class="words" id="slip-words"><b id="slip-name"></b><p id="slip-desc"></p></div>
    </div>
  </div>
</main>
<script src="/inventory.js?v=3"></script>
<script src="drawer.js?v=9"></script>
<script src="/face/popup.js" data-every="45-90"></script>
</body>
</html>
