<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Drawer</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="drawer.css?v=1">
</head>
<body>
<!-- Looking down into the open desk drawer. Whatever the visitor has found lies inside.
     Items come from /items.json; what this visitor owns comes from /inventory.js (their browser only). -->
<main class="room">
  <a class="shut" href="/backstage/#desk">&larr; shut the drawer</a>

  <div class="drawer" id="drawer">
    <div class="rim">
      <div class="floor" id="floor" aria-label="Inside the drawer">
        <p class="empty" id="empty" hidden>nothing in here.</p>
      </div>
    </div>
    <div class="front">
      <span class="knob" aria-hidden="true"></span>
      <div class="slip" id="slip" aria-live="polite" hidden>
        <b id="slip-name"></b>
        <p id="slip-desc"></p>
      </div>
    </div>
  </div>
</main>
<script src="/inventory.js?v=1"></script>
<script src="drawer.js?v=1"></script>
<script src="/face/popup.js" data-every="45-90"></script>
</body>
</html>
