<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/RenderProductions.ico">
<title>SYSTEM TELEMETRY // FREQ SCANNER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050810;
    color: #ffe600;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    width: 100vw;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2rem 1rem;
  }

  /* Robotic Grid Overlay */
  #static {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: 
      linear-gradient(rgba(255,230,0,0.01) 50%, rgba(0,0,0,0.25) 50%),
      repeating-linear-gradient(0deg, rgba(5,8,16,0.6) 0px, rgba(5,8,16,0.6) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 10;
  }

  #noisecanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.04;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 5;
    text-align: center;
    max-width: 680px;
    width: 100%;
    padding: 2.5rem;
    background: #090e1a;
    border: 1px solid rgba(255,230,0,0.25);
    box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,230,0,0.03);
  }

  /* Tech Corner Accents */
  .container::before, .container::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: #ffe600;
    border-style: solid;
  }
  .container::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .container::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  #signaltext {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #ffe600;
    text-shadow: 0 0 10px rgba(255,230,0,0.5);
    margin-bottom: 0.5rem;
  }

  #channeltext {
    font-size: 12px;
    letter-spacing: 3px;
    color: #999300;
    margin-bottom: 2.5rem;
    border-bottom: 1px dashed rgba(255,230,0,0.2);
    padding-bottom: 1rem;
  }

  .tuner {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,230,0,0.3);
    padding: 14px 18px;
    background: #0d1322;
    flex-wrap: wrap;
    justify-content: center;
  }

  .tuner label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #bfa800;
  }

  .tuner input {
    background: #04060b;
    border: 1px solid rgba(255,230,0,0.4);
    color: #ffe600;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    letter-spacing: 3px;
    padding: 8px 12px;
    width: 220px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
  }

  .tuner input:focus {
    border-color: #ffe600;
    box-shadow: 0 0 8px rgba(255,230,0,0.3);
  }

  .tuner button {
    background: #121b30;
    border: 1px solid rgba(255,230,0,0.5);
    color: #ffe600;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .tuner button:hover {
    background: rgba(255,230,0,0.15);
  }

  #errormsg {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #ff4d4d;
    min-height: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #errormsg.show { opacity: 1; }

  .signalblock {
    display: none;
    margin-top: 2rem;
    border-top: 1px solid rgba(255,230,0,0.2);
    padding-top: 1.5rem;
    text-align: left;
    background: #060912;
    padding: 1.25rem;
    border: 1px solid rgba(255,230,0,0.15);
  }

  .signalblock.show {
    display: block;
    animation: fadein 0.4s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fragment {
    font-size: 16px;
    letter-spacing: 1px;
    line-height: 1.7;
    color: #e6cc00;
    word-break: break-word;
  }

  .fragment.decoy {
    color: #cca300;
  }

  .freqlabel {
    font-size: 11px;
    color: #7a7500;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  .timestamp {
    font-size: 10px;
    color: #595500;
    letter-spacing: 1px;
    margin-top: 1rem;
    border-top: 1px dotted rgba(255,230,0,0.1);
    padding-top: 0.5rem;
  }

  #history {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
</style>
</head>
<body>

<canvas id="noisecanvas"></canvas>
<div id="static"></div>

<div class="container">
  <div id="signaltext">SYSTEM: NO SIGNAL</div>
  <div id="channeltext">CH 01 // RENDER VISION TELEMETRY // ACTIVE SCAN</div>

  <div class="tuner">
    <label for="codeinput">FREQ</label>
    <input type="text" id="codeinput" maxlength="40" placeholder="ENTER CODE" autocomplete="off">
    <button id="tunebtn">EXECUTE</button>
  </div>
  <div id="errormsg">[ERROR]: FREQUENCY NOT LOCATED</div>

  <div id="history"></div>
</div>

<script>
  var canvas = document.getElementById('noisecanvas');
  var ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawNoise() {
    var w = canvas.width;
    var h = canvas.height;
    if (!w || !h) return;
    var imageData = ctx.createImageData(w, h);
    var buffer = imageData.data;
    for (var i = 0; i < buffer.length; i += 4) {
      var v = Math.random() * 255;
      buffer[i] = v;
      buffer[i+1] = v;
      buffer[i+2] = v;
      buffer[i+3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  setInterval(drawNoise, 100);
  drawNoise();

  var SIGNALS = {
    "7540": {
      type: "lore",
      fragment: "He used to be so thoughtful.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "RENDER": {
      type: "progressive",
      fragment: "The thing we always need more of, but the thing we waste the most.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
    "TIME": {
      type: "progressive",
      fragment: "It heals all wounds.",
      timestamp: "LOG RECOVERED // SOURCE: OFFLINE CHANNEL"
    },
   "67": {
     type: "decoy",
     fragment: "The 67 meme is officially dead to me. It’s reached that stage where an internet joke stops being a funny surprise and just becomes annoying background noise. At first, I loved it because people were being so creative with the references, but now it’s just the same punchline everywhere. It feels like people aren't even trying to be clever anymore; they’re just repeating it because everyone else is. <br> It’s honestly frustrating how it pops up in every single comment section and Discord server I’m in. Instead of actually contributing to a conversation, it just derails everything with a reference I’ve already seen a thousand times. The shock value is gone, and without that, there’s no humor left—just predictable repetition. <br> What bothers me most is how forced it feels now. People shoehorn it into conversations where it makes zero sense, which turns it from a joke into straight-up spam. I love how fast internet culture moves and how we’re always finding new ways to laugh, but this meme just hasn't evolved. It’s stuck in the same format with no room for creativity. I think it’s time we all just move on to something actually fresh and original.",
     timestamp: "DIAGNOSTIC: EVALUATE PARAMETERS."
   },
   "WONDER": {
     type: "decoy",
     fragment: "You think you're tough shit putting Varandia: Retold character names in here, huh? you're not getting any lore with this!",
     timestamp: "OVERRIDE ACCEPTED."
   },
   "AM": {
     type: "rare",
     fragment: "Never for me to plunge my hands in cool water on a hot day.",
     timestamp: "SYSTEM ALERT: CRITICAL MASS."
   },
   "ARCHIE": {
    type: "rare",
    fragment: "I AM A FUCKING ARCHITECT! I'M JUST STUCK SELLING SHIT FURNITURE BECAUSE SOMEONE WON'T GET OFF THEIR FAT FUCKING ASS AND HELP ME!",
    timestamp: "VECTOR: 60 DEGREES."
   },
   "TRIANGLE": {
    type: "lore",
    fragment: "I never wanted to hurt him, you know that?",
    timestamp: "WARNING: PROTOCOL BREACH."
   }
  };

  var input = document.getElementById('codeinput');
  var btn = document.getElementById('tunebtn');
  var errormsg = document.getElementById('errormsg');
  const signalHistory = document.getElementById("history");
  var signaltext = document.getElementById('signaltext');

  function tryUnlock() {
    var raw = input.value.trim().toUpperCase();
    if (!raw) return;

    var entry = SIGNALS[raw];

    if (entry) {
      errormsg.classList.remove('show');

      var block = document.createElement('div');
      block.className = 'signalblock';

      var fragClass = entry.type === 'decoy' ? 'fragment decoy' : 'fragment';

      block.innerHTML =
        '<div class="freqlabel">FREQ // ' + raw + ' [CONNECTED]</div>' +
        '<div class="' + fragClass + '">' + entry.fragment + '</div>' +
        '<div class="timestamp">' + entry.timestamp + '</div>';

      signalHistory.prepend(block);
      requestAnimationFrame(function() {
        block.classList.add('show');
      });

      signaltext.textContent = "SYSTEM: SIGNAL ACQUIRED";
      input.value = '';
    } else {
      errormsg.classList.add('show');
      setTimeout(function() {
        errormsg.classList.remove('show');
      }, 1500);
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });
</script>

</body>
</html>
