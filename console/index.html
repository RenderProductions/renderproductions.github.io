<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RV://CONSOLE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root { --g: #00ff6a; --g2: #00c853; --dim: #0b5d2a; --bg: #000; --red: #ff3b3b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--g); overflow: hidden; }
  body { font: 18px/1.35 'VT323', 'IBM Plex Mono', monospace; }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .55; }
  .crt::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%); }
  .term { position: relative; z-index: 2; width: min(980px, 94vw); height: min(640px, 86vh); margin: 7vh auto 0;
    display: flex; flex-direction: column; background: rgba(0, 12, 4, .86); border: 1px solid var(--g2);
    box-shadow: 0 0 0 1px rgba(0,255,106,.15), 0 0 40px rgba(0,255,106,.25), inset 0 0 60px rgba(0,255,106,.06); }
  .bar { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem .8rem; border-bottom: 1px solid var(--dim); color: var(--g2); font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  .bar a { color: var(--g2); text-decoration: none; } .bar a:hover { color: var(--g); text-shadow: 0 0 8px var(--g); }
  #out { flex: 1; overflow-y: auto; padding: .8rem 1rem .4rem; white-space: pre-wrap; word-break: break-word; text-shadow: 0 0 6px rgba(0,255,106,.55); }
  #out::-webkit-scrollbar { width: 8px; } #out::-webkit-scrollbar-thumb { background: var(--dim); }
  .ln { margin: 0; } .me { color: #b9ffcf; } .sys { color: var(--g2); } .err { color: var(--red); text-shadow: 0 0 8px rgba(255,59,59,.6); } .faint { color: var(--dim); text-shadow: none; }
  .row { display: flex; align-items: center; gap: .5rem; padding: .5rem 1rem .8rem; border-top: 1px solid var(--dim); }
  .ps1 { color: var(--g2); white-space: nowrap; }
  #in { flex: 1; font: inherit; color: var(--g); background: transparent; border: 0; outline: 0; caret-color: var(--g); text-shadow: 0 0 6px rgba(0,255,106,.55); }
  #in::placeholder { color: var(--dim); }
  .busy .ps1::after { content: ' ▓'; animation: blink .6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .btn { font: inherit; color: var(--bg); background: var(--g); border: 0; padding: .2rem .9rem; cursor: pointer; box-shadow: 0 0 14px rgba(0,255,106,.6); }
  .denied { animation: shake .4s; } @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (max-width: 600px) { body { font-size: 16px; } .term { margin-top: 3vh; height: 92vh; } }
  @media (prefers-reduced-motion: reduce) { .denied, .busy .ps1::after { animation: none; } }
</style>
</head>
<body class="crt">
<canvas id="rain" aria-hidden="true"></canvas>
<main class="term" aria-label="Admin console">
  <div class="bar"><span>RV://CONSOLE <span id="srv" class="faint"></span></span><a href="/">[ exit ]</a></div>
  <div id="out" role="log" aria-live="polite"></div>
  <form class="row" id="form" autocomplete="off">
    <label class="ps1" for="in" id="ps1">guest@render:~$</label>
    <input id="in" spellcheck="false" autocapitalize="off" placeholder="type help" disabled>
  </form>
</main>
<script src="/rv.js"></script>
<script>
(function () {
  var out = document.getElementById('out'), input = document.getElementById('in'), form = document.getElementById('form');
  var term = document.querySelector('.term'), ps1 = document.getElementById('ps1');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var history = [], hi = 0, owner = false, queue = Promise.resolve();
  var NAMES = ['help', 'servers', 'channels', 'say', 'reply', 'marquez', 'todd', 'rain', 'haunt', 'status', 'run', 'backup', 'post', 'clear', 'whoami', 'exit'];

  // ------------------------------------------------------------ digital rain (⬡ and katakana)
  var cv = document.getElementById('rain'), g = cv.getContext('2d'), cols = [], F = 16;
  var GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789⬡⬡⬡$#%RVTODD';
  function size() { cv.width = innerWidth; cv.height = innerHeight; cols = Array.from({ length: Math.ceil(cv.width / F) }, function () { return Math.random() * -cv.height / F; }); }
  size(); addEventListener('resize', size);
  function rain() {
    g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, 0, cv.width, cv.height);
    g.font = F + 'px VT323, monospace';
    cols.forEach(function (y, i) {
      var ch = GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
      g.fillStyle = Math.random() < .03 ? '#d6ffe4' : '#00c853'; g.fillText(ch, i * F, y * F);
      cols[i] = y * F > cv.height && Math.random() > .975 ? 0 : y + 1;
    });
  }
  if (!reduce) setInterval(rain, 55); else { g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height); }

  // ------------------------------------------------------------ output
  function line(text, cls, typed) {
    var p = document.createElement('p'); p.className = 'ln' + (cls ? ' ' + cls : '');
    out.appendChild(p);
    if (!typed || reduce || text.length > 1500) { p.textContent = text; out.scrollTop = out.scrollHeight; return Promise.resolve(); }
    return new Promise(function (done) {
      var i = 0, step = Math.max(2, Math.ceil(text.length / 60));
      (function tick() { i += step; p.textContent = text.slice(0, i); out.scrollTop = out.scrollHeight; if (i < text.length) requestAnimationFrame(tick); else done(); })();
    });
  }
  function say(text, cls) { queue = queue.then(function () { return line(text, cls, true); }); return queue; }
  function deny() { term.classList.remove('denied'); void term.offsetWidth; term.classList.add('denied'); }

  // ------------------------------------------------------------ talking to the bot
  function send(cmd) {
    return RV.run('__console ' + cmd).then(function (r) {
      if (r.denied) { deny(); throw new Error('ACCESS DENIED. This console is for the bot owner.'); }
      return String(r.content || 'Done.');
    });
  }
  function exec(raw) {
    var cmd = raw.trim(); if (!cmd) return;
    history.push(cmd); hi = history.length;
    line(ps1.textContent + ' ' + cmd, 'me');
    var name = cmd.split(/\s+/)[0].toLowerCase();
    if (name === 'clear' || name === 'cls') { out.textContent = ''; return; }
    if (name === 'exit') { location.href = '/'; return; }
    if (name === 'whoami') { var me = RV.me(); say(me ? me.name + ' (' + me.id + ')' + (owner ? ' · owner' : '') : 'nobody', 'sys'); return; }
    if (!owner) { deny(); say('ACCESS DENIED.', 'err'); return; }
    form.classList.add('busy'); input.disabled = true;
    send(cmd).then(function (t) { return say(t); }, function (e) { return say(e.message === 'login' ? 'Session expired. Reload and log in again.' : 'ERR: ' + e.message, 'err'); })
      .then(function () { form.classList.remove('busy'); input.disabled = false; input.focus(); });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); var v = input.value; input.value = ''; exec(v); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = history[--hi]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(history.length, hi + 1); input.value = history[hi] || ''; }
    else if (e.key === 'Tab') {
      e.preventDefault(); var v = input.value.toLowerCase(), m = NAMES.filter(function (n) { return n.indexOf(v) === 0; });
      if (m.length === 1) input.value = m[0] + ' '; else if (m.length > 1 && v) say(m.join('  '), 'faint');
    }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.textContent = ''; }
  });
  term.addEventListener('click', function () { if (!getSelection().toString()) input.focus(); });

  // ------------------------------------------------------------ boot
  function boot() {
    say('RENDER PRODUCTIONS // RV CONSOLE v1.0', 'sys');
    say('establishing link to render\'s vision...', 'faint');
    var me = RV.me();
    if (!RV.token() || !me) {
      say('NO SESSION. Authenticate with Discord to continue.', 'err').then(function () {
        var b = document.createElement('button'); b.className = 'btn'; b.textContent = '> LOG IN WITH DISCORD'; b.onclick = RV.login;
        out.appendChild(b);
      });
      return;
    }
    ps1.textContent = me.name.toLowerCase().replace(/[^a-z0-9_.-]/g, '') + '@render:~$';
    var guild = RV.guild() ? Promise.resolve(RV.guild()) : RV.servers().then(function (l) { if (l[0]) RV.setGuild(l[0].id); return l[0] && l[0].id; });
    guild.then(function (gid) {
      if (!gid) throw new Error('No server to relay through. Play in a server with the bot first.');
      say('identity: ' + me.name + ' · verifying clearance...', 'faint');
      return send('help');
    }).then(function (help) {
      owner = true;
      return say('ACCESS GRANTED.', 'sys').then(function () { return say(help); }).then(function () { return say('Tab completes · ↑↓ history · clear · exit', 'faint'); });
    }, function (e) {
      return say(/DENIED/.test(e.message) ? e.message : 'ERR: ' + e.message, 'err');
    }).then(function () { input.disabled = false; input.focus(); });
  }
  boot();
})();
</script>
</body>
</html>
